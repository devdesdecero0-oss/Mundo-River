name: Auditoría diaria y reporte

on:
  schedule:
    # 07:00 America/Argentina/Buenos_Aires = 10:00 UTC.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar navegador para E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Ejecutar auditoría
        id: auditoria
        continue-on-error: true
        run: node scripts/auditoria-diaria.mjs

      - name: Enviar reporte por Gmail
        if: always()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}

        run: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage
          from pathlib import Path

          report_dir = Path("reports/diarios")
          reports = sorted(report_dir.glob("auditoria-*.md"))
          if not reports:
              raise SystemExit("No se encontró el reporte diario")
          report = reports[-1]
          body = report.read_text(encoding="utf-8")

          message = EmailMessage()
          message["Subject"] = f"Mundo River — {report.stem}"
          message["From"] = os.environ["GMAIL_USER"]
          message["To"] = os.environ["REPORT_EMAIL"]
          message.set_content(body)

          context = ssl.create_default_context()
          with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as smtp:
              smtp.ehlo()
              smtp.starttls(context=context)
              smtp.ehlo()
              smtp.login(
                  os.environ["GMAIL_USER"],
                  os.environ["GMAIL_APP_PASSWORD"].replace(" ", ""),
              )
              smtp.send_message(message)
          PY

      - name: Guardar reporte y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-diaria-${{ github.run_number }}
          path: reports/diarios/
          if-no-files-found: warn

      - name: Marcar la ejecución como fallida
        if: steps.auditoria.outcome == 'failure'
        run: |
          echo "La auditoría terminó con validaciones fallidas. Revisar el reporte enviado."
          exit 1
